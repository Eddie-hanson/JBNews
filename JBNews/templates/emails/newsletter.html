<!-- NewsApp/templates/emails/newsletter.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <style>
        body        { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .wrapper    { max-width: 600px; margin: 30px auto; background: #fff; border-radius: 6px; overflow: hidden; }
        .header     { background: #1a1a1a; padding: 20px 30px; }
        .header h1  { color: #e47a2e; margin: 0; font-size: 24px; }
        .body       { padding: 30px; }
        .label      { display: inline-block; background: #e47a2e; color: #fff;
                      font-size: 11px; font-weight: 700; text-transform: uppercase;
                      letter-spacing: 1px; padding: 3px 10px; border-radius: 3px;
                      margin-bottom: 14px; text-decoration: none; }
        .body h2    { font-size: 22px; font-weight: 700; color: #1a1a1a;
                      margin: 0 0 16px; line-height: 1.3; }
        .body img   { width: 100%; max-height: 300px; object-fit: cover;
                      border-radius: 4px; margin-bottom: 16px; display: block; }
        .body p     { font-size: 15px; color: #444; line-height: 1.7; margin: 0 0 20px; }
        .read-more  { display: inline-block; background: #e47a2e; color: #fff;
                      padding: 10px 24px; border-radius: 4px; text-decoration: none;
                      font-weight: 700; font-size: 14px; }
        .footer     { background: #f4f4f4; padding: 16px 30px; text-align: center;
                      font-size: 12px; color: #999; }
        .footer a   { color: #e47a2e; }
    </style>
</head>
<body>
    <div class="wrapper">

        <div class="header">
            <h1>JBNews</h1>
        </div>

        <div class="body">
            {% if article.category %}
            <a class="label" href="#">{{ article.category.name }}</a>
            {% endif %}

            <h2>{{ article.title }}</h2>

            <img src="{{ article_picture_url }}" alt="{{ article.title }}" />

            <p>{{ article_excerpt }}</p>

            <a class="read-more" href="{{ article_url }}">Read Full Article</a>
        </div>

        <div class="footer">
            <p>
                You are receiving this because you subscribed to JBNews updates.<br />
                <a href="{{ unsubscribe_url }}">Unsubscribe</a>
            </p>
        </div>

    </div>
</body>
</html>
